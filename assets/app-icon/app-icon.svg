<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3EC"/>
      <stop offset="1" stop-color="#3F82D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EAF2FC"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4C878"/>
      <stop offset="1" stop-color="#C8A95B"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A3A66" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 家族の絆を表すハート -->
  <g filter="url(#soft)">
    <path transform="translate(272,278) scale(4.8)"
      d="M50,30 C35,2 0,7 0,40 C0,74 34,84 50,100 C66,84 100,74 100,40 C100,7 65,2 50,30 Z"
      fill="url(#heart)"/>
  </g>

  <!-- 家族3人を表す円（3児の子育てチーム） -->
  <g transform="translate(512,556)" fill="#4A90E2">
    <circle cx="-104" cy="6" r="46" fill-opacity="0.85"/>
    <circle cx="104" cy="6" r="46" fill-opacity="0.85"/>
    <circle cx="0" cy="-30" r="58"/>
  </g>

  <!-- Hoku の星（金のアクセント） -->
  <g transform="translate(726,296)">
    <path d="M0,-94 C13,-31 31,-13 94,0 C31,13 13,31 0,94 C-13,31 -31,13 -94,0 C-31,-13 -13,-31 0,-94 Z"
      fill="url(#star)"/>
    <circle cx="0" cy="0" r="21" fill="#ffffff" fill-opacity="0.95"/>
  </g>
</svg>
