<title>Familink</title>
<script>
  /* キャッシュ回避：毎回タイムスタンプ付きで最新の familink.html を読み込む。
     端末（特にホーム画面アプリ）が古い画面を保持し続ける問題を防ぐ。 */
  (function(){
    var url = 'app-source/familink.html?t=' + Date.now();
    try { location.replace(url); } catch(e) { location.href = url; }
  })();
</script>
