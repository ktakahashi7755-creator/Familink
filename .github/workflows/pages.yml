name: Deploy to GitHub Pages

# トリガー：main ブランチへの push、または手動実行
# 注意：以前は 3 ブランチを対象にしていたが、1 回の push で 3 つの run が
# 同時起動し concurrency(cancel-in-progress) で main の run まで打ち消され、
# 公開が止まる問題があった。Pages の公開元は main 1 本に限定する。
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新だけを保持（main 単独トリガーなので競合しない）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # docs/index.html がアプリ本体（app-source/familink.html のコピー）
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
